      - "tests/test_native_png.py"
      - "tests/test_gs_texture_upload_trace.py"
      - "tests/test_sdbz_texture_log_analysis.py"
      - "tests/test_sdbz_texture_crosswalk.py"
      - "tests/test_sdbz_fpix_gs_match.py"
      - "tests/test_native_texture_residency.py"
      - "tests/test_gs_shader_setup_stride.py"
      - "runtime/data/native_textures.registry"
      - "runtime/src/gs/native_texture_residency.cpp"
      - "docs/sdbz-main-menu-verified-fingerprints.csv"
      - "runtime/src/gs/native_texture_residency.cpp"
      - "runtime/src/gs/native_texture_residency.hpp"
      - "runtime/src/sdbz_texture_source_probe.cpp"
      - "runtime/src/sdbz_texture_source_probe.hpp"
      - "runtime/src/dispatch.cpp"
      - "tests/test_sdbz_texture_source_probe.py"
      - "runtime/src/gs/raster.cpp"
      - "runtime/src/gs/gpu/gpu.cpp"
      - "runtime/src/gs/gpu/gpu.hpp"
      - "runtime/src/gs/gpu/gs.wgsl"
      - "scripts/match_sdbz_fpix_gs.py"
      - "scripts/dump_sdbz_game_textures.py"
      - "tests/test_dump_sdbz_game_textures.py"
      - "scripts/crosswalk_sdbz_texture_candidates.py"
      - "scripts/analyze_sdbz_texture_log.py"
      - "runtime/src/gs/gs.cpp"
      - "runtime/src/gs/texture_upload_trace.hpp"
      - "runtime/src/gs/native_texture.cpp"
      - "runtime/src/gs/native_texture.hpp"
      - ".github/workflows/sdbz-disc-tests.yml"
  push:
    branches: [SDBZ]
    paths:
      - "runtime/src/disc.cpp"
      - "runtime/src/disc_folder.cpp"
      - "runtime/src/disc_folder.hpp"
      - "runtime/include/ps2/disc.hpp"
      - "tests/test_game_dat_loose_assets.py"
      - "tests/test_disc_folder_expansion.py"
      - "tests/test_eu_beta_virtual_info.py"
      - "tests/test_native_assets.py"
      - "tests/test_resource_packs.py"
      - "runtime/src/resource_pack.cpp"
      - "runtime/src/resource_pack_overlay.cpp"
      - "runtime/include/ps2/resource_pack_overlay.hpp"
      - "host/window.cpp"
      - "host/texture_dump_job.cpp"
      - "host/texture_dump_job.hpp"
      - "tests/test_texture_dump_job.cpp"
      - "tests/test_resource_pack_menu_input.py"
      - "runtime/src/gs/gpu/font.cpp"
      - "runtime/src/gs/gpu/font.hpp"
      - "runtime/src/resource_pack_zip.cpp"
      - "runtime/src/resource_pack_zip.hpp"
      - "scripts/build_red_menu_pack.py"
      - "runtime/include/ps2/resource_pack.hpp"
      - "tests/test_native_png.py"
      - "tests/test_gs_texture_upload_trace.py"
      - "tests/test_sdbz_texture_log_analysis.py"
      - "tests/test_sdbz_texture_crosswalk.py"
      - "tests/test_sdbz_fpix_gs_match.py"
      - "tests/test_native_texture_residency.py"
      - "tests/test_gs_shader_setup_stride.py"
      - "runtime/data/native_textures.registry"
      - "runtime/src/gs/native_texture_residency.cpp"
      - "docs/sdbz-main-menu-verified-fingerprints.csv"
      - "runtime/src/gs/native_texture_residency.cpp"
      - "runtime/src/gs/native_texture_residency.hpp"
      - "runtime/src/sdbz_texture_source_probe.cpp"
      - "runtime/src/sdbz_texture_source_probe.hpp"
      - "runtime/src/dispatch.cpp"
      - "tests/test_sdbz_texture_source_probe.py"
      - "runtime/src/gs/raster.cpp"
      - "runtime/src/gs/gpu/gpu.cpp"
      - "runtime/src/gs/gpu/gpu.hpp"
      - "runtime/src/gs/gpu/gs.wgsl"
      - "scripts/match_sdbz_fpix_gs.py"
      - "scripts/dump_sdbz_game_textures.py"
      - "tests/test_dump_sdbz_game_textures.py"
      - "scripts/crosswalk_sdbz_texture_candidates.py"
      - "scripts/analyze_sdbz_texture_log.py"
      - "runtime/src/gs/gs.cpp"
      - "runtime/src/gs/texture_upload_trace.hpp"
      - "runtime/src/gs/native_texture.cpp"
      - "runtime/src/gs/native_texture.hpp"
      - ".github/workflows/sdbz-disc-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  folder-disc:
    name: Folder disc / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify host overlay compiles with SDL2
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev
          $CXX -std=c++20 -Wall -Wextra -fsyntax-only \
            -I host -I runtime/include -I runtime/src \
            $(sdl2-config --cflags) host/window.cpp host/texture_dump_job.cpp
      - name: Compile full PS2 runtime including named GS bindings
        # The runtime uses Clang-specific VU vector builtins; GCC remains
        # covered by the independent host and resource-pack harnesses.
        if: matrix.compiler == 'clang++'
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          cmake -S . -B /tmp/sdbz-texture-compiler-check \
            -DCMAKE_CXX_COMPILER="$CXX" -DPS2_FETCH_ZLIB=OFF
          cmake --build /tmp/sdbz-texture-compiler-check \
            --target ps2runtime --parallel 2
      - name: Run archive and ISO regression harnesses
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          python3 -m unittest discover -s tests -p 'test_game_dat_loose_assets.py' -v
          python3 -m unittest discover -s tests -p 'test_disc_folder_expansion.py' -v
          python3 -m unittest discover -s tests -p 'test_eu_beta_virtual_info.py' -v
          python3 -m unittest discover -s tests -p 'test_native_assets.py' -v
          python3 -m unittest discover -s tests -p 'test_resource_packs.py' -v
          python3 -m unittest discover -s tests -p 'test_resource_pack_menu_input.py' -v
          python3 -m unittest discover -s tests -p 'test_native_png.py' -v
          python3 -m unittest discover -s tests -p 'test_gs_texture_upload_trace.py' -v
          python3 -m unittest discover -s tests -p 'test_sdbz_texture_log_analysis.py' -v
          python3 -m unittest discover -s tests -p 'test_sdbz_texture_crosswalk.py' -v
          python3 -m unittest discover -s tests -p 'test_sdbz_fpix_gs_match.py' -v
          python3 -m unittest discover -s tests -p 'test_dump_sdbz_game_textures.py' -v
          $CXX -std=c++20 -Wall -Wextra -Werror -pthread \
            -I host tests/test_texture_dump_job.cpp host/texture_dump_job.cpp \
            -lz -o /tmp/sdbz-native-texture-dump-test
          /tmp/sdbz-native-texture-dump-test
          python3 -m unittest discover -s tests -p 'test_native_texture_residency.py' -v
          python3 -m unittest discover -s tests -p 'test_sdbz_texture_source_probe.py' -v
          python3 -m unittest discover -s tests -p 'test_gs_shader_setup_stride.py' -v
          test -s runtime/data/native_textures.registry
